name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tools:
    name: Tools and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make test
      - name: Address and undefined behavior sanitizers
        run: >-
          make test CC=clang BUILD=build/asan
          CFLAGS='-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
          LDFLAGS='-fsanitize=address,undefined'
      - name: Fuzz the attribute encoding (libFuzzer, bounded time)
        run: make fuzz FUZZ_TIME=30
      - name: Validate site links
        run: python3 scripts/check-site.py
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends shellcheck
      - name: shellcheck the harness scripts
        run: |
          set -eu
          files=$(ls vm/*.sh build/*.sh 2>/dev/null || true)
          [ -n "$files" ] || { echo "no shell scripts found"; exit 1; }
          # shellcheck disable=SC2086
          shellcheck --shell=sh $files
      - name: SPDX license headers on C sources
        run: |
          set -eu
          missing=0
          for f in $(find layer common tools tests include -type f \( -name '*.c' -o -name '*.h' \) -not -path 'tests/third_party/*' -not -name '*.mod.c' | sort); do
            if ! head -n 1 "$f" | grep -q 'SPDX-License-Identifier:'; then
              echo "missing SPDX header: $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
      - name: DCO sign-off on every commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_REF"
          bad=0
          for c in $(git rev-list "origin/$BASE_REF..HEAD" --no-merges); do
            if ! git log -1 --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "commit $c lacks a Signed-off-by line (use git commit -s)"
              git log -1 --format='  %h %s' "$c"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ]
  native:
    name: Native Linux VM
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make vm-test
      - name: Preserve VM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-vm-evidence
          path: |
            build/vm/console.log
            build/vm/image-report.json
            build/vm/environment.txt
            build/vm/kernel.config
          if-no-files-found: warn
          retention-days: 30
